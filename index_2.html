<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pittura barocca – presentazione</title>
  <link rel="stylesheet" href="shared-effects.css">
</head>

<body>
<a href="index.html" class="back-home" title="Torna al menu">&#8962;</a>
<div id="impress" data-width="1920" data-height="1080" data-images-folder="immagini_2/">

  <!-- titolo -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <div class="author">Dario Castello<div class="dates">(1601-1631)</div></div>
    <div class="opera">Sonata prima a sopran solo</div>
  </div>

  <!-- step 1 -->
  <div class="step fx-fade"
      data-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="1.jpg">
  </div>

  <!-- step 2 -->
  <div class="step zoom-step"
    data-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    
    style="--zoom-tx: -19.5%; --zoom-ty: -90%; --zoom-scale: 2.8; --zoom-duration: 6000ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 3 -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="1.1.jpg">
  </div>

  <!-- step 4 -->
  <div class="step reverse-zoom-step"
    data-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: -19.5%; --zoom-ty: -90%; --zoom-scale: 2.8; --zoom-duration: 6000ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 5 -->
  <div class="step fx-fade"
    data-x="0"
    data-y="0"
    data-scale="1"
    style="--fade-duration: 4200ms;">
    <img data-image="2.jpg">
  </div>

  <!-- step 6 -->
  <div class="step zoom-step"
    data-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    
    style="--zoom-tx: -28.5%; --zoom-ty: 75%; --zoom-scale: 2.5; --zoom-duration: 6000ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 7 -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="2.1.jpg">
  </div>

  <!-- step 8 -->
  <div class="step reverse-zoom-step"
    data-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    style="--zoom-tx: -28.5%; --zoom-ty: 75%; --zoom-scale: 2.5; --zoom-duration: 6000ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 9 -->
  <div class="step fx-fade"
    data-x="0"
    data-y="0"
    data-scale="1"
    style="--fade-duration: 4200ms;">
    <img data-image="3.jpg">
  </div>

  <!-- step 10 -->
  <div class="step zoom-step"
    data-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 0%; --zoom-ty: -52%; --zoom-scale: 2.01; --zoom-duration: 6000ms; --zoom-ease: ease-in-out;">
    <img data-image="3.jpg">
  </div>

  <!-- step 11 -->
  <div class="step"
    data-x="0"
    data-y="0"
    data-scale="1">
    <img data-image="3.1.jpg">
  </div>
</div>
