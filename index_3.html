<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">

<body>

<div id="impress" data-width="1920" data-height="1080" data-transition-duration="3000" data-images-folder="immagini_3/">

  <!-- titolo -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <div class="author">R. Rognoni<div class="dates">(1550 – 1620)</div></div>
    <div class="opera">Diminuzioni “ancor che col partire” su versi di Cipriano de Rore</div>
  </div>

  <!-- step 1 -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="m1a.jpg">
  </div>

  <!-- step 2 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="m1b.jpg">
  </div>

  <!-- step 3 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="m1c.jpg">
  </div>

  <!-- step 4 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="m1d.jpg">
  </div>

  <!-- step 5 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="m1e.jpg">
  </div>

  <!-- step 6 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="m1f.jpg">
  </div>

  <!-- step 7 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="2.jpg">
  </div>

  <!-- step 8 -->
  <div class="step"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="3.jpg">
  </div>

  <!-- step 9 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    data-auto-next-delay="5000"
    style="--zoom-tx: 15%; --zoom-ty: -30%; --zoom-scale: 2.8; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="3.jpg">
  </div>

  <!-- step 9 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    
    style="--zoom-tx: 15%; --zoom-ty: -30%; --zoom-scale: 2.8; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="3.jpg">
  </div>
</div>
