<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pittura barocca – presentazione</title>
  <link rel="stylesheet" href="shared-effects.css">
</head>

<body>
<a href="index.html" class="back-home" title="Torna al menu">&#8962;</a>
<div id="impress" data-width="1920" data-height="1080" data-transition-duration="3500" data-images-folder="immagini_4/">

  <!-- titolo -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <div class="author">Bartolomeo Montalbano<div class="dates">(1598 – 1651)</div></div>
    <div class="opera">Sinfonia terza “Sghemma”</div>
  </div>

  <!-- step 1 -->
  <div class="step fx-fade"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="1.jpg">
  </div>

  <!-- step 2 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    style="--zoom-tx: -22%; --zoom-ty: -21%; --zoom-scale: 4.8; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 4 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    style="--zoom-tx: -22%; --zoom-ty: -21%; --zoom-scale: 4.8; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 5 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 60%; --zoom-ty: 50%; --zoom-scale: 4.8; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 6 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="1.2.jpg">
  </div>

  <!-- step 7 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 60%; --zoom-ty: 50%; --zoom-scale: 4.8; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 8 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: -67%; --zoom-ty: -10%; --zoom-scale: 3; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

  <!-- step 9 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="1.3.jpg">
  </div>

  <!-- step 10 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    style="--zoom-tx: -67%; --zoom-ty: -10%; --zoom-scale: 3; --zoom-duration: 5800ms; --zoom-ease: ease-in-out;">
    <img data-image="1.jpg">
  </div>

</div>

<!-- Impress.js offline -->
<script src="impress.js"></script>
<script src="shared-effects.js"></script>

</body>
</html>
