<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pittura barocca – presentazione</title>
  <link rel="stylesheet" href="shared-effects.css">
</head>

<body>
<a href="index.html" class="back-home" title="Torna al menu">&#8962;</a>
<div id="impress" data-width="1920" data-height="1080" data-transition-duration="2000" data-images-folder="immagini_8/">

  <!-- titolo -->
  <div class="step"
      data-x="0"
      data-y="0"
      data-scale="1">
    <div class="author">Antonio Bertali<div class="dates">(1605 – 1669)</div></div>
    <div class="opera">Sonata seconda per violino, viola da gamba e basso</div>
  </div>

  <!-- step 1 -->
  <div class="step fx-fade"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="1.jpg">
  </div>

 <!-- step 2 -->
  <div class="step fx-fade"
      data-rel-x="1500"
      data-y="0"
      data-scale="1">
    <img data-image="2.jpg">
  </div>

  <!-- step 3 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 40%; --zoom-ty: 35%; --zoom-scale: 2.5; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 4 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="2.1.jpg">
  </div>

  <!-- step 5 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 40%; --zoom-ty: 35%; --zoom-scale: 2.5; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 6 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: -23%; --zoom-ty: 0%; --zoom-scale: 1.1; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 7 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="2.2.jpg">
  </div>

  <!-- step 8 -->
  <div class="step reverse-zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="false"
    data-auto-next-target="img"
    style="--zoom-tx: -23%; --zoom-ty: 0%; --zoom-scale: 1.1; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="2.jpg">
  </div>

  <!-- step 9 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="3.jpg">
  </div>

  <!-- step 10 -->
  <div class="step zoom-step"
    data-rel-x="0"
    data-y="0"
    data-scale="1"
    data-auto-next-on-animation-end="true"
    data-auto-next-target="img"
    style="--zoom-tx: 35%; --zoom-ty: -25%; --zoom-scale: 1.5; --zoom-duration: 3800ms; --zoom-ease: ease-in-out;">
    <img data-image="3.jpg">
  </div>

  <!-- step 11 -->
  <div class="step"
      data-rel-x="0"
      data-y="0"
      data-scale="1">
    <img data-image="3.1.jpg">
  </div>

</div>

<script src="impress.js"></script>
<script src="shared-effects.js"></script>

</body>
</html>
